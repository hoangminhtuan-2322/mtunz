name: Render PostgreSQL integration

on:
  # Check PostgreSQL compatibility before merging, then recheck each main commit.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtunz_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mtunz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtunz_ci -d mtunz_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql://mtunz_ci:ci-only-password@localhost:5432/mtunz_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify upgrade of preexisting Neon-style schema (CI database only)
        run: python tests/smoke_legacy_upgrade.py
      - name: Test Python imports and SQL against PostgreSQL
        run: python tests/smoke_postgres.py
      - name: Verify logical backup and restore using the exact service image
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          # A newer pg_restore may emit SET statements unknown to PostgreSQL 16.
          # Reuse the exact running service image (already present locally).
          export MTUNZ_CI_PG_IMAGE="$(docker inspect --format '{{.Image}}' "$POSTGRES_SERVICE_ID")"
          test -n "$MTUNZ_CI_PG_IMAGE"
          export MTUNZ_CI_BACKUP_DIR="$(mktemp -d "$RUNNER_TEMP/mtunz-pg-backup.XXXXXX")"
          export TMPDIR="$MTUNZ_CI_BACKUP_DIR"
          tools="$(mktemp -d "$RUNNER_TEMP/mtunz-pg-tools.XXXXXX")"
          trap 'rm -rf "$MTUNZ_CI_BACKUP_DIR" "$tools"' EXIT
          cat > "$tools/pg_dump" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$(basename "$0")"
          case "$tool" in pg_dump|pg_restore) ;; *) exit 64 ;; esac
          exec docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$MTUNZ_CI_BACKUP_DIR,dst=$MTUNZ_CI_BACKUP_DIR" \
            --env PGHOST --env PGPORT --env PGDATABASE --env PGUSER \
            --env PGPASSWORD --env PGSSLMODE --env PGCHANNELBINDING \
            --env PGCONNECT_TIMEOUT --env PGSSLROOTCERT \
            "$MTUNZ_CI_PG_IMAGE" "$tool" "$@"
          SH
          chmod +x "$tools/pg_dump"
          ln -s pg_dump "$tools/pg_restore"
          export PATH="$tools:$PATH"
          dump_version="$(pg_dump --version)"
          restore_version="$(pg_restore --version)"
          echo "$dump_version"
          echo "$restore_version"
          [[ "$dump_version" =~ ^pg_dump\ \(PostgreSQL\)\ 16\. ]]
          [[ "$restore_version" =~ ^pg_restore\ \(PostgreSQL\)\ 16\. ]]
          python tests/smoke_backup_restore.py

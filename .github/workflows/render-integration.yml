name: Render PostgreSQL integration

on:
  # Check PostgreSQL compatibility before merging, then recheck each main commit.
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/chat-message-delete-menu-v11, fix/support-chat-continuous-composer-v12, feat/reciprocal-presence-read-privacy-v13, feat/admin-realtime-member-review-v14, perf/mobile-smooth-chat-v15]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtunz_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mtunz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtunz_ci -d mtunz_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql://mtunz_ci:ci-only-password@localhost:5432/mtunz_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify upgrade of preexisting Neon-style schema (CI database only)
        run: python tests/smoke_legacy_upgrade.py
      - name: Test Python imports and SQL against PostgreSQL
        run: python tests/smoke_postgres.py
      - name: Verify community IDs, polls and message recall on PostgreSQL
        env:
          DATABASE_URL: postgresql://mtunz_ci:ci-only-password@localhost:5432/mtunz_regression
        run: |
          psql "$TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mtunz_regression'
          python -m pytest -q \
            tests/test_v6_features.py::test_room_slow_mode_polls_one_vote_and_admin_permissions \
            tests/test_v6_features.py::test_recall_updates_notices_and_unread_without_affecting_other_messages \
            tests/test_community_plus_v7.py::test_event_creation_and_attendance \
            tests/test_community_plus_v7.py::test_world_appeal_and_pin_review \
            tests/test_social_v2.py::test_seven_digit_public_ids_and_nonadmin_direct_messaging \
            tests/test_complete_features.py::test_single_notice_read_is_private_and_unread_filter_runs_before_limit \
            tests/test_complete_features.py::test_group_membership_edit_reactions_and_moderation \
            tests/test_v6_features.py::test_studio_preferences_and_admin_intake_controls

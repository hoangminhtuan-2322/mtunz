name: Render PostgreSQL integration

on:
  # Check PostgreSQL compatibility before merging, then recheck each main commit.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtunz_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mtunz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtunz_ci -d mtunz_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql://mtunz_ci:ci-only-password@localhost:5432/mtunz_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify upgrade of preexisting Neon-style schema (CI database only)
        run: python tests/smoke_legacy_upgrade.py
      - name: Test Python imports and SQL against PostgreSQL
        run: python tests/smoke_postgres.py
      - name: Install matching PostgreSQL backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Verify logical backup and restore into separate disposable database
        run: python tests/smoke_backup_restore.py

name: Test signed mtunz APK on a real Android device (Firebase)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "SUCCESSFUL main-branch Build mtunz Android (web-synced TWA) run ID containing signed release APK"
        required: true
        type: string
      device_model:
        description: "PHYSICAL Firebase Test Lab model ID from gcloud firebase test android models list"
        required: true
        type: string
      android_version:
        description: "Supported Android version ID for that physical model"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  firebase-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs and trusted signed build origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
          MODEL: ${{ inputs.device_model }}
          OS_VERSION: ${{ inputs.android_version }}
          PROJECT_ID: ${{ vars.MTUNZ_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid source run ID"; exit 1; }
          [[ "$MODEL" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::Invalid device model"; exit 1; }
          [[ "$OS_VERSION" =~ ^[0-9]+$ ]] || { echo "::error::Invalid device version"; exit 1; }
          [[ -n "$PROJECT_ID" ]] || { echo "::error::Configure repository variable MTUNZ_FIREBASE_PROJECT_ID"; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          echo "$run_json" | jq -e '.status == "completed" and .conclusion == "success" and .head_branch == "main"' >/dev/null ||
            { echo "::error::Source build must be a successful main-branch workflow run"; exit 1; }
      - name: Download the real-key signed release APK
        uses: actions/download-artifact@v4
        with:
          name: mtunz-web-android-RELEASE-stable-signing
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify upgrade-compatible certificate and application ID
        run: python android-web/tools/verify_release_artifact.py --apk release/mtunz-web-release.apk
      - name: Authenticate to Firebase Test Lab
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.MTUNZ_FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ vars.MTUNZ_FIREBASE_PROJECT_ID }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Verify selected Firebase device is actually PHYSICAL
        shell: bash
        env:
          MODEL: ${{ inputs.device_model }}
          OS_VERSION: ${{ inputs.android_version }}
          PROJECT_ID: ${{ vars.MTUNZ_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud firebase test android models describe "$MODEL" \
            --project "$PROJECT_ID" --format=json > "$RUNNER_TEMP/mtunz-model.json"
          python - "$RUNNER_TEMP/mtunz-model.json" <<'PY'
          import json,os,sys
          from pathlib import Path
          model=json.loads(Path(sys.argv[1]).read_text())
          if model.get('formFactor','').upper()!='PHYSICAL':
              raise SystemExit('This is not real Android hardware: choose a PHYSICAL Test Lab model.')
          if os.environ['OS_VERSION'] not in [str(v) for v in model.get('supportedVersionIds',[])]:
              raise SystemExit('Android version is not supported by selected physical model.')
          print('Confirmed PHYSICAL Android model and supported Android version.')
          PY
      - name: Run Robo smoke test on physical Android hardware
        shell: bash
        env:
          MODEL: ${{ inputs.device_model }}
          OS_VERSION: ${{ inputs.android_version }}
          PROJECT_ID: ${{ vars.MTUNZ_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Choose a PHYSICAL model/version pair from the Firebase Test Lab
          # device catalog. Robo is a launch/navigation smoke test, not an
          # authenticated chat, notification or administrator acceptance test.
          gcloud firebase test android run \
            --project "$PROJECT_ID" \
            --type robo \
            --app release/mtunz-web-release.apk \
            --device "model=$MODEL,version=$OS_VERSION,locale=vi,orientation=portrait" \
            --timeout 5m

      - name: Record verified physical-device test provenance
        shell: bash
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
          DEVICE_MODEL: ${{ inputs.device_model }}
          DEVICE_VERSION: ${{ inputs.android_version }}
        run: |
          set -euo pipefail
          mkdir -p physical-test
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          apk=Path('release/mtunz-web-release.apk')
          record={
              'source_run_id':int(os.environ['SOURCE_RUN']),
              'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
              'device_model':os.environ['DEVICE_MODEL'],
              'android_version':os.environ['DEVICE_VERSION'],
              'test_type':'firebase-physical-robo',
              'claims':'launch/navigation smoke only; manual functional tests still required',
          }
          Path('physical-test/attestation.json').write_text(json.dumps(record,indent=2))
          PY
      - name: Upload physical-device attestation (no credentials or user data)
        uses: actions/upload-artifact@v4
        with:
          name: mtunz-physical-device-qa
          path: physical-test/attestation.json
          if-no-files-found: error
          retention-days: 30

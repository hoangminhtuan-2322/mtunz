name: Publish verified Android preview
on:
  push:
    branches: [ci/publish-android-preview-45333101932]
    paths: ['.github/workflows/publish-android-preview.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: '45333101932'
      SOURCE_SHA: '39e79d28236f4277f88e9cd71aa2cb28988052bd'
      TAG: android-preview-v1.1.0-code11-run45333101932
    steps:
      - name: Validate exact successful source build
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" | jq -e --arg sha "$SOURCE_SHA" '.conclusion=="success" and .head_sha==$sha and .head_repository.full_name==.repository.full_name'
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" | jq -e '.artifacts[] | select(.id==14893197664 and .expired==false and .name=="mtunz-NATIVE-SIDEBYSIDE-PREVIEW-debug")' >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: mtunz-NATIVE-SIDEBYSIDE-PREVIEW-debug
          run-id: 45333101932
          github-token: ${{ github.token }}
          path: preview-apk
      - name: Verify APK identity and publish prerelease
        run: |
          set -euo pipefail
          APK=preview-apk/app-release.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx assets/index.android.bundle
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.mtunz.web.preview' versionCode='11' versionName='1.1.0'"
          OUT=preview-apk/mtunz-android-preview-v1.1.0-code11.apk
          mv "$APK" "$OUT"
          sha256sum "$OUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite.'
            exit 1
          fi
          gh release create "$TAG" "$OUT" --target "$SOURCE_SHA" --prerelease --latest=false --title "mtunz Android 1.1.0 Preview (build 11)" --notes "Bản thử nghiệm debug, package com.mtunz.web.preview, cài song song. Chưa có push nền, chưa kiểm thử đầy đủ trên thiết bị. Không thay thế bản chính thức."

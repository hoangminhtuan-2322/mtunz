name: Verify mtunz premium UI

on:
  pull_request:
    branches: [main]
  # Always evaluate every main commit; Render checksPass must never skip a
  # backend-only or policy-only change because it missed a path filter.
  push:
    branches: [main, feat/private-identity-download-v17]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/extras.js
          node --check static/premium.js
          node --check static/admin-console.js
          node --check static/member-experience.js
          node --check static/social-upgrade.js
          node --check static/social-v2.js
          node --check static/world-moderation.js
          node --check static/admin-v3.js
          node --check static/admin-v5.js
          node --check static/world-release.js
          node --check static/messenger-v4.js
          node --check static/smart-v6.js
          node --check static/community-v6.js
          node --check static/admin-ops-v6.js
          node --check static/community-plus-v7.js
          node --check static/admin-readiness-v7.js
          node --check static/admin-upgrade.js
          node --check static/motion-lite.js
          node --check static/mobile-polish.js
      - name: Verify tab-scoped login survives page refresh
        run: node tests/tab_session_lifecycle.cjs
      - name: Check isolated auth animation and keyboard tab state
        run: |
          node tests/auth_isolation.cjs
          node tests/member_navigation.cjs
      - name: Verify left-side hero motion scope
        run: |
          node tests/hero_motion_isolation.cjs
      - name: Verify approved registration content flow and consent layout
        run: |
          node tests/registration_layout.cjs
      - name: Verify 30-day account lifecycle and privileged deletion UI
        run: node tests/account_lifecycle_ui.cjs
      - name: Verify registration contacts, admin details, logout dialog and motion
        run: node tests/contact_and_motion_ui.cjs
      - name: Verify Admin full-width layout across breakpoints
        run: |
          node tests/admin_layout.cjs
      - name: Verify Admin password and PIN form geometry
        run: |
          node tests/admin_security_layout.cjs
      - name: Test upgraded Admin console and protected actions
        run: node tests/admin_console.cjs
      - name: Verify contextual login error feedback
        run: node tests/auth_feedback.cjs
      - name: Verify optional support memory field
        run: node tests/support_optional_ui.cjs
      - name: Verify detailed Admin audit and protected account actions
        run: node tests/admin_audit_ui.cjs
      - name: Verify readable admin audit record explanations
        run: node tests/audit_readable_details.cjs
      - name: Verify Admin Clarity enhancements
        run: node tests/admin_upgrade.cjs
      - name: Verify Admin V5 security dashboard and reset safety boundaries
        run: node tests/admin_security_v5_ui.cjs
      - name: Verify V6 smart conversation, community and Admin controls
        run: node tests/v6_ui.cjs
      - name: Verify V7 events, appeals, call stability and readiness
        run: node tests/community_plus_v7_ui.cjs
      - name: Prepublic V8 security and smooth world/Admin UI contracts
        run: node tests/prepublic_v8_ui.cjs
      - name: Verify modern member messaging experience
        run: node tests/member_experience.cjs
      - name: Verify optimized mobile keyboard, touch and responsive layouts
        run: node tests/mobile_polish.cjs
      - name: Verify friendship, pin, forwarding and settings UI
        run: |
          node tests/social_upgrade.cjs
          node tests/private_identity_media_ui.cjs
      - name: Verify World Chat concept page (no live public messaging)
        run: node tests/world_preview.cjs
      - name: Verify group lobby spacing and simple Coming soon
        run: node tests/group_lobby_ui.cjs
      - name: Verify public release policy pages, image security and consent
        run: node tests/public_release_ui.cjs
      - name: Verify first-login name and phone sign-in interface
        run: node tests/first_login_ui.cjs
      - name: Verify World Chat, reports, and separate Profile
        run: node tests/world_moderation_ui.cjs
      - name: Verify private session manager and Admin-only security details
        run: node tests/device_sessions_ui.cjs
      - name: Check theme wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('static/index.html').read_text(encoding='utf-8')
          infra = Path('render.yaml').read_text(encoding='utf-8')
          assert 'autoDeployTrigger: checksPass' in infra
          assert '/static/premium.css?v=2.2' in h
          assert '/static/aurora.css?v=3.0' in h
          assert '/static/notifications.css?v=4.0' in h
          assert '/static/favicon.svg?v=8.0' in h
          assert '/static/orbit-brand.css?v=8.0' in h
          assert '/static/premium.js' in h
          assert '/static/app.js' in h
          assert '/static/extras.js' in h
          assert 'defer' in h
          assert 'role="status"' in h
          css = Path('static/premium.css').read_text(encoding='utf-8')
          js = Path('static/premium.js').read_text(encoding='utf-8')
          assert 'prefers-reduced-motion' in css
          aurora = Path('static/aurora.css').read_text(encoding='utf-8')
          application = Path('static/app.js').read_text(encoding='utf-8')
          mark = Path('static/favicon.svg').read_text(encoding='utf-8')
          assert 'prefers-reduced-motion' in aurora
          signals = Path('static/signals.css').read_text(encoding='utf-8')
          assert 'signal-stage' in signals and 'signal-feature' in application
          assert 'art-v5' in application and 'nova-stage' in application
          nova = Path('static/hero-nova.css').read_text(encoding='utf-8')
          assert '.auth-art.art-v5' in nova and 'prefers-reduced-motion' in nova
          assert 'nova-orbit-spin' in nova and 'nova-stage-enter' in nova
          assert '/static/signals.css?v=4.0' in h
          assert '/static/app.js?v=20.9' in h
          assert '/static/auth-glow.css?v=16.0' in h
          assert '/static/form-layout.css?v=8.4' in h
          assert '/static/account-delete.css?v=9.0' in h
          assert 'data-act="delete-own-account"' in application
          assert 'data-act="admin-delete-user"' in application
          assert '/static/ui-interactions.css?v=1.0' in h
          assert '/static/performance.css?v=8.2' in h
          assert '/static/motion-lite.js?v=8.2' in h
          assert '/static/hero-nova.css?v=7.0' in h
          assert '/static/auth-refined.css?v=5.1' in h
          assert '/static/remember-device.css?v=6.0' in h
          assert '/static/extras.js?v=18.5' in h
          assert '/static/group-lobby.css?v=1.0' in h
          assert '/static/device-sessions.css?v=11.0' in h
          assert 'auth-remember-choice' in application
          assert 'showcase-contact' not in application
          assert 'tối thiểu 10 ký tự' in application
          assert 'brandGlyph' in application and 'class="brand-glyph"' in application
          assert 'aria-labelledby' in application and 'notify-toast' in application
          notices = Path('static/notifications.css').read_text(encoding='utf-8')
          assert 'prefers-reduced-motion' in notices and 'notify-progress' in notices
          assert '<svg' in mark and 'mtunz Orbit' in mark
          assert 'orbit-front' in mark and 'star-glow' in mark
          assert 'src="/static/favicon.svg?v=8.0"' in application
          orbit = Path('static/orbit-brand.css').read_text(encoding='utf-8')
          assert '.logo-mark' in orbit and '.nova-nucleus' in orbit
          assert '.boot-screen .loading-logo' in orbit and 'prefers-reduced-motion' in orbit
          perf = Path('static/performance.css').read_text(encoding='utf-8')
          assert '.auth-art.art-v5 .nova-orbit.nova-orbit-one' in perf
          assert 'animation:nova-orbit-spin 42s' in perf
          motion = Path('static/motion-lite.js').read_text(encoding='utf-8')
          assert 'visibilitychange' in motion and 'saveData' in motion
          assert 'requestAnimationFrame' not in motion
          assert 'backdrop-filter:none!important' in perf
          assert 'initializeHeroMotion' not in application
          import json
          manifest = json.loads(Path('static/manifest.webmanifest').read_text(encoding='utf-8'))
          assert manifest['icons'][0]['src'] == '/static/favicon.svg?v=8.0'
          assert 'MỘT KHÔNG GIAN, NHIỀU KẾT NỐI' in application
          assert '<h1 class="auth-headline-copy nova-headline">Kết nối không giới hạn.<br><span class="gradient-text">Trò chuyện theo cách bạn.</span></h1>' in application
          assert '<p class="nova-description">Gửi đi cảm xúc. Giữ lại kết nối. Tạo nên những câu chuyện của riêng bạn.</p>' in application
          assert 'Gần nhau hơn.<br>' not in application
          assert 'aria-invalid' in js
          assert '/api/username/check' in js
          assert 'field-error' in css and 'is-loading' in css
          print('Premium assets and validation wiring are present.')
          PY
      - name: Run Python API regression tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Exercise chat actions and scroll on desktop and mobile Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/chat-browser" playwright-core@1.56.1
          export NODE_PATH="$RUNNER_TEMP/chat-browser/node_modules"
          export DATA_DIR="$(mktemp -d)"
          python -m uvicorn app:app --host 127.0.0.1 --port 8791 > "$RUNNER_TEMP/chat-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl --retry 12 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8791/health
          node tests/mobile_live_chat.cjs
          node tests/private_identity_media_browser.cjs

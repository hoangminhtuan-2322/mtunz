name: Build mtunz native Android preview (debug-signed)

on:
  push:
    branches:
      - main
      - feature/native-mobile-chat-v1
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: mtunz-native-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Android push configuration when configured
        env:
          MTUNZ_ANDROID_GOOGLE_SERVICES: ${{ secrets.MTUNZ_ANDROID_GOOGLE_SERVICES }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          if [[ -z "$MTUNZ_ANDROID_GOOGLE_SERVICES" && -z "$EXPO_PROJECT_ID" ]]; then
            echo "Building without Android cloud messaging configuration."
            exit 0
          fi
          if [[ -z "$MTUNZ_ANDROID_GOOGLE_SERVICES" || -z "$EXPO_PROJECT_ID" ]]; then
            echo "::error::Android push requires both MTUNZ_ANDROID_GOOGLE_SERVICES and EXPO_PROJECT_ID."
            exit 1
          fi
          umask 077
          printf '%s' "$MTUNZ_ANDROID_GOOGLE_SERVICES" > google-services.json
          echo "GOOGLE_SERVICES_FILE=./google-services.json" >> "$GITHUB_ENV"
          echo "EXPO_PROJECT_ID=$EXPO_PROJECT_ID" >> "$GITHUB_ENV"
      - name: Generate Android native project
        env:
          EXPO_PUBLIC_API_URL: https://mtunz.onrender.com
          CI: '1'
        run: npx expo prebuild --platform android --non-interactive
      - name: Build standalone release-mode APK with Android debug signing
        env:
          EXPO_PUBLIC_API_URL: https://mtunz.onrender.com
          CI: '1'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
      - name: Verify standalone JS bundle and APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/index.android.bundle'
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
      - name: Smoke-test native Android startup on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -e
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.mtunz.mobile/.MainActivity
            sleep 22
            if ! adb shell pidof com.mtunz.mobile >/dev/null; then
              echo '::error::mtunz native app exited after launch; recent Android logs follow.'
              adb logcat -d -t 1500 | grep -E 'AndroidRuntime|FATAL EXCEPTION|ReactNativeJS|com.mtunz.mobile' | tail -100 || true
              exit 1
            fi
            echo 'Native Android app remained alive after launch.'
      - name: Upload standalone Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mtunz-native-android-PREVIEW-debug-signed
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

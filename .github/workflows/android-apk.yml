name: Build mtunz Android test APK

on:
  push:
    branches:
      - feature/native-mobile-chat-v1
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android native project
        env:
          EXPO_PUBLIC_API_URL: https://mtunz.onrender.com
          CI: '1'
        run: npx expo prebuild --platform android --non-interactive
      - name: Build unsigned-release-independent Android debug APK
        env:
          EXPO_PUBLIC_API_URL: https://mtunz.onrender.com
          CI: '1'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: mtunz-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

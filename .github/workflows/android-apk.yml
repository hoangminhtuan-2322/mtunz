name: Build mtunz TRUE Native Android APK

on:
  push:
    branches: [main, feature/mtunz-true-native-android-release]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      sign_release:
        description: "Sign the fully NATIVE mtunz APK using the same permanent key as Android 1.0.1"
        required: true
        type: boolean
        default: false

concurrency:
  group: mtunz-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://mtunz.onrender.com
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify original logo and native identity
        run: |
          test "$(git hash-object assets/icon.png)" = '282a6971e38d51ce570b094e07d5624663bbedbb'
          node - <<'NODE'
          const f=require('./app.json').expo;
          if(f.android.package!=='com.mtunz.web'||f.android.versionCode!==11||f.version!=='1.1.0')
            throw Error('Native package/version must update mtunz 1.0.1 without changing package');
          if(f.icon!=='./assets/icon.png')throw Error('Original logo was replaced');
          NODE
          if grep -R -nE 'react-native-webview|androidbrowserhelper|TrustedWebActivity|CustomTabs' App.js src; then
            echo '::error::A native chat app must not embed a website or Custom Tabs.'
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Configure push services when provided for com.mtunz.web
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.MTUNZ_ANDROID_GOOGLE_SERVICES }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
          REQUIRE_NATIVE_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$REQUIRE_NATIVE_PUSH" != "true" ]]; then
            echo '::warning::Native side-by-side preview does not bundle production Firebase. Push is disabled in preview.'
            exit 0
          fi
          if [[ -z "$GOOGLE_SERVICES_JSON" && -z "$EXPO_PROJECT_ID" ]]; then
            if [[ "$REQUIRE_NATIVE_PUSH" == "true" ]]; then
              echo '::error::Cannot publish a signed native APK with background notifications disabled. Configure EXPO_PROJECT_ID and MTUNZ_ANDROID_GOOGLE_SERVICES first.'
              exit 1
            fi
            echo '::warning::Native preview has no push credentials; background notifications will not work.'
            exit 0
          fi
          if [[ -z "$GOOGLE_SERVICES_JSON" || -z "$EXPO_PROJECT_ID" ]]; then
            echo '::error::Native push needs BOTH EXPO_PROJECT_ID and MTUNZ_ANDROID_GOOGLE_SERVICES for com.mtunz.web.'
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          echo "GOOGLE_SERVICES_FILE=./google-services.json" >> "$GITHUB_ENV"
          echo "EXPO_PROJECT_ID=$EXPO_PROJECT_ID" >> "$GITHUB_ENV"
      - name: Regress native realtime catch-up and window merges
        run: node ../tests/native_realtime_stability.cjs
      - name: Verify native parity and upload retries
        run: node ../tests/native_world_typing_parity.cjs
      - name: Verify real shared gallery and media viewers
        run: node ../tests/native_shared_gallery.cjs
      - name: Verify native Admin operations and PIN protections
        run: node ../tests/native_admin_parity.cjs
      - name: Verify native Admin fast reconnect and push lifecycle
        run: node ../tests/native_admin_reconnect.cjs
      - name: Verify live presence, privacy and Web parity in native app
        run: node ../tests/native_smart_presence.cjs
      - name: Verify compact settings and honest push UI
        run: node ../tests/native_account_settings.cjs
      - name: Verify safe restoration of Android sessions after network outages
        run: node ../tests/native_session_recovery.cjs
      - name: Verify Android release catalog and shared update interface
        run: |
          cd ..
          python3 -m unittest discover -s tests -p test_android_release_catalog.py
          node --check static/app.js
          node tests/native_android_download.cjs
      - name: Verify password visibility and PIN masking on web and Android
        run: node ../tests/password_visibility.cjs
      - name: Check responsive Android login on narrow screens
        run: node ../tests/native_auth_layout.cjs
      - name: Keep composer visible above Android keyboard
        run: node ../tests/native_keyboard_composer.cjs
      - name: Guard polished chat, images, send and icon regressions
        run: node ../tests/native_chat_quality.cjs
      - name: Verify push release credentials and support reply routing
        run: node ../tests/native_push_release.cjs
      - name: Verify Firebase/Expo push release prerequisites
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        env:
          EXPO_FCM_V1_READY: ${{ vars.EXPO_FCM_V1_READY }}
        run: node tools/verify_push_release.cjs
      - name: Generate ACTUAL Android native project and JS bundle
        run: npx expo prebuild --platform android --non-interactive
      - name: Check generated native manifest and launch package
        run: |
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          grep -F 'com.mtunz.web' android/app/build.gradle
          if grep -R -nE 'com.google.androidbrowserhelper.trusted.LauncherActivity|android.support.customtabs.trusted.DEFAULT_URL' android/app/src/main; then
            echo '::error::Generated app unexpectedly uses TWA browser wrapper.'
            exit 1
          fi
      - name: Require the permanent signing key only for authorized main release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MTUNZ_ANDROID_WEB_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo '::error::Set all four original NEW-fixed-key secrets in GitHub Actions.'; exit 1;
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mtunz-fixed-release.jks"
          test -s "$RUNNER_TEMP/mtunz-fixed-release.jks"
          echo "MTUNZ_NATIVE_KEYSTORE_PATH=$RUNNER_TEMP/mtunz-fixed-release.jks" >> "$GITHUB_ENV"
      - name: Configure release signing (NEVER debug key for distribution)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        env:
          MTUNZ_NATIVE_KEYSTORE_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEYSTORE_PASSWORD }}
          MTUNZ_NATIVE_KEY_ALIAS: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_ALIAS }}
          MTUNZ_NATIVE_KEY_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_PASSWORD }}
        run: node tools/configure_fixed_release_signing.cjs --release
      - name: Install and verify Android native CMake toolchain with retry
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          for attempt in 1 2 3; do
            echo "Installing Android CMake 3.22.1 (attempt $attempt/3)"
            rm -rf "$ANDROID_HOME/cmake/3.22.1" "$ANDROID_HOME/.temp"/*cmake* || true
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "cmake;3.22.1" </dev/null; then
              if [[ -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake" ]]; then
                "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version
                break
              fi
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::Android SDK CMake archive was unavailable or corrupt after three attempts.'
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Build standalone native RELEASE with the permanent mtunz signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        env:
          MTUNZ_NATIVE_KEYSTORE_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEYSTORE_PASSWORD }}
          MTUNZ_NATIVE_KEY_ALIAS: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_ALIAS }}
          MTUNZ_NATIVE_KEY_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
      - name: Give debug preview an independent Android identity
        if: ${{ ! (github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main') }}
        run: node tools/configure_preview_package.cjs
      - name: Build standalone NATIVE preview with debug signing only
        if: ${{ ! (github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main') }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2
      - name: Verify native JS bundle and APK signature
        env:
          SIGNED_NATIVE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/index.android.bundle'
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK"
          EXPECTED_PACKAGE=com.mtunz.web.preview
          if [[ "$SIGNED_NATIVE_RELEASE" == "true" ]]; then EXPECTED_PACKAGE=com.mtunz.web; fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='$EXPECTED_PACKAGE' versionCode='11' versionName='1.1.0'"
      - name: Enforce fixed release certificate, NOT debug signer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        run: python ../android-web/tools/verify_release_artifact.py --apk android/app/build/outputs/apk/release/app-release.apk
      - name: Detect Android emulator hardware acceleration
        id: native_emulator
        run: |
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Android KVM virtualization is available.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Runner has no usable /dev/kvm. Android emulator smoke cannot run here; physical-device QA is still required.'
          fi
      - name: Check app launches as native UI on Android emulator
        if: steps.native_emulator.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: mobile
          script: bash tools/smoke_native_android.sh
      - name: Report Android emulator limitation without claiming device QA
        if: steps.native_emulator.outputs.available != 'true'
        run: |
          echo '::warning::Native build and signing passed, but no Android runtime launch was verified on this GitHub runner.'
          echo 'Native runtime QA must be performed on a physical Android phone before distributing widely.'
      - name: Upload NATIVE preview (DEBUG-signed, not for updating existing installation)
        if: ${{ ! (github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v4
        with:
          name: mtunz-NATIVE-SIDEBYSIDE-PREVIEW-debug
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload NATIVE release (permanent signing key, can update TWA 1.0.1)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_release && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: mtunz-NATIVE-1.1.0-RELEASE-fixed-key
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

name: Publish latest verified mtunz Android APK
on:
  workflow_run:
    workflows: ["Build mtunz TRUE Native Android APK"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/android-publish-latest.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mtunz-public-android-catalog
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Select newest successful trusted main build with signed artifact
        id: source
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GH_REPO/actions/workflows/android-apk.yml/runs?branch=main&status=success&per_page=30" --jq '.workflow_runs[] | select(.head_branch=="main" and (.event=="push" or .event=="workflow_dispatch") and .head_repository.full_name==.repository.full_name) | [.id,.head_sha] | @tsv')"
          while IFS=$'\t' read -r RUN SHA; do
            [[ "$RUN" =~ ^[0-9]+$ && "$SHA" =~ ^[a-f0-9]{40}$ ]] || continue
            ARTIFACT="$(gh api "repos/$GH_REPO/actions/runs/$RUN/artifacts" --jq '.artifacts[] | select(.expired==false and (.name | test("^mtunz-NATIVE-[0-9]+\\.[0-9]+\\.[0-9]+-RELEASE-fixed-key$"))) | .name' | head -1)"
            [[ -n "$ARTIFACT" ]] || continue
            STATUS="$(gh api "repos/$GH_REPO/compare/$SHA...main" --jq '.status')"
            [[ "$STATUS" == ahead || "$STATUS" == identical ]] || continue
            echo "run=$RUN" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
            exit 0
          done <<< "$RUNS"
          echo "::notice::No verified main release artifact is available."
      - name: Download signed artifact
        if: steps.source.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: release-apk
      - name: Independently verify APK and publish newer build only
        if: steps.source.outputs.run != ''
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          ARTIFACT_NAME: ${{ steps.source.outputs.artifact }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          APK=release-apk/app-release.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx assets/index.android.bundle
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TOOLS="$SDK/build-tools/36.0.0"
          if [[ ! -x "$TOOLS/apksigner" || ! -x "$TOOLS/aapt" ]]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          fi
          CERT="$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]' | sort -u)"
          test "$CERT" = '806A147A4142203F05EAD8C5763D4CD559C4D6CCB9ECFF02BA728D59AA1A8F7B'
          BADGING="$("$TOOLS/aapt" dump badging "$APK")"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | sed -n '/^package: name=/p')"
          [[ "$PACKAGE_LINE" == "package: name='com.mtunz.web' "* ]]
                    CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")"
                    VERSION="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionName='\\([0-9]*\\.[0-9]*\\.[0-9]*\\)'.*/\\1/p")"
          [[ "$CODE" =~ ^[1-9][0-9]{0,9}$ && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CODE" -le 2100000000 && "$ARTIFACT_NAME" == "mtunz-NATIVE-$VERSION-RELEASE-fixed-key" ]]
          MAX="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft==false and .prerelease==false) | .tag_name' | awk -F'-code' '/^android-v[0-9]+\.[0-9]+\.[0-9]+-code[1-9][0-9]*$/ {print $2}' | sort -n | tail -1)"
          if [[ -n "$MAX" && "$CODE" -le "$MAX" ]]; then
            echo "::notice::Build $CODE is already published or older."
            exit 0
          fi
          TAG="android-v$VERSION-code$CODE"
          OUT="release-apk/mtunz-android-v$VERSION-code$CODE.apk"
          mv "$APK" "$OUT"
          sha256sum "$OUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release tag already exists; refusing overwrite."
            exit 0
          fi
          gh release create "$TAG" "$OUT" --target "$SOURCE_SHA" --title "mtunz Android $VERSION (build $CODE)" --notes "Android Native, Firebase FCM V1 configured; permanent signing certificate verified. Source build: $SOURCE_RUN. Android only. Physical-device testing remains necessary for changes in each build." --latest=false

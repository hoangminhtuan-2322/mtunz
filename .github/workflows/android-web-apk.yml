            sleep 12
            adb shell dumpsys activity activities | tail -80 || true
            # Surface crash diagnostics without treating unrelated system or
            # Chrome exceptions as proof that the mtunz package crashed.
            adb logcat -d -b crash | grep -C 6 -F 'com.mtunz.web' || true

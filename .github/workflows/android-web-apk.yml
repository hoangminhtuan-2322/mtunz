name: Build mtunz Android (web-synced TWA)

on:
  push:
    # Temporary authorized one-time signing branch, removed after release build.
    branches: [main, fix/android-signing-sdk-selection-and-release-20261123]
    paths:
      - 'android-web/**'
      - 'static/android-assetlinks.json'
      - '.github/workflows/android-web-apk.yml'
  pull_request:
    paths:
      - 'android-web/**'
      - 'static/android-assetlinks.json'
      - '.github/workflows/android-web-apk.yml'
  workflow_dispatch:
    inputs:
      sign_release:
        description: "Sign mtunz APK with permanently pinned NEW key (requires 4 secrets)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-web:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Protect user-supplied APK identity and original app logo
        run: python android-web/tools/verify_app_identity.py
      - name: Verify website association configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          statements = json.loads(Path('static/android-assetlinks.json').read_text())
          assert any(
              entry.get('target', {}).get('namespace') == 'android_app'
              and entry['target'].get('package_name') == 'com.mtunz.web'
              and 'delegate_permission/common.handle_all_urls' in entry.get('relation', [])
              and bool(entry['target'].get('sha256_cert_fingerprints'))
              for entry in statements
          ), 'Missing mtunz web TWA digital asset link'
          print('Digital Asset Links format is valid.')
          PY
      - name: Build installable preview and unsigned release APK
        run: gradle -p android-web :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --max-workers=2
      - name: Verify preview APK and launcher
        run: |
          set -euo pipefail
          apk=android-web/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.mtunz.web'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "launchable-activity: name='com.mtunz.web.MainActivity'"
      - name: Upload test APK (debug-signed; not for distribution)
        uses: actions/upload-artifact@v4
        with:
          name: mtunz-web-android-PREVIEW-debug-signed
          path: android-web/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable Android emulator hardware acceleration
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Smoke-test installation and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -e
            adb install -r android-web/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.mtunz.web | grep -F 'package:'
            # The TWA can hand off to Chrome. dumpsys package need not show
            # a fully-qualified activity name and must not fail this test.
            adb shell am start -W -n com.mtunz.web/.MainActivity | tee /tmp/mtunz-launch.txt
            grep -Eq '^Status: ok$' /tmp/mtunz-launch.txt
            grep -Eq '^Activity: com.mtunz.web/.MainActivity$' /tmp/mtunz-launch.txt
            sleep 12
            adb shell dumpsys activity activities | tail -80 || true
            adb logcat -d -b crash | grep -C 6 -F 'com.mtunz.web' || true
      - name: Check production signing secrets
        id: signing
        if: (github.event_name == 'workflow_dispatch' && inputs.sign_release) || (github.event_name == 'push' && github.ref == 'refs/heads/fix/android-signing-sdk-selection-and-release-20261123')
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MTUNZ_ANDROID_WEB_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD")
          count=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then count=$((count + 1)); fi
          done
          if [[ "$count" == 0 ]]; then
            echo '::error::Signing requires the NEW fixed mtunz release keystore from the private owner backup. Configure all four MTUNZ_ANDROID_WEB_* secrets first.'
            exit 1
          fi
          if [[ "$count" != 4 ]]; then
            echo '::error::Provide all four MTUNZ_ANDROID_WEB_* signing secrets.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mtunz-web-release.jks"
          test -s "$RUNNER_TEMP/mtunz-web-release.jks"
          echo "MTUNZ_WEB_KEYSTORE=$RUNNER_TEMP/mtunz-web-release.jks" >> "$GITHUB_ENV"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Validate NEW fixed certificate and sign release APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MTUNZ_ANDROID_WEB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cert_hex="$(keytool -exportcert -keystore "$MTUNZ_WEB_KEYSTORE" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD | openssl dgst -sha256 -binary | xxd -p -c 256)"
          python - "$cert_hex" <<'PY'
          import json,sys
          from pathlib import Path
          digest=sys.argv[1].upper()
          assert len(digest)==64, 'Invalid certificate SHA-256'
          fingerprint=':'.join(digest[i:i+2] for i in range(0,64,2))
          # Owner-approved NEW fixed signing key; v1.0.0 cannot be updated in place.
          new_fingerprint=(
              '80:6A:14:7A:41:42:20:3F:05:EA:D8:C5:76:3D:4C:D5:'
              '59:C4:D6:CC:B9:EC:FF:02:BA:72:8D:59:AA:1A:8F:7B'
          )
          if fingerprint != new_fingerprint:
              raise SystemExit('Keystore does not match pinned NEW mtunz release key: '+fingerprint)
          signing=json.loads(Path('android-web/release-signing.json').read_text())
          if signing.get('release_cert_sha256') != new_fingerprint:
              raise SystemExit('Pinned certificate configuration changed unexpectedly.')

          statements=json.loads(Path('static/android-assetlinks.json').read_text())
          authorized=any(
              entry.get('target',{}).get('package_name')=='com.mtunz.web'
              and fingerprint in entry.get('target',{}).get('sha256_cert_fingerprints',[])
              for entry in statements
          )
          if not authorized:
              raise SystemExit('Production certificate '+fingerprint+
                  ' is not authorized in static/android-assetlinks.json. '+
                  'Publish this exact fingerprint and deploy it before signing.')
          print('Signing certificate matches the website association.')
          PY
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -p 4 \
            android-web/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/mtunz-web-aligned.apk"
          "$tools/apksigner" sign \
            --ks "$MTUNZ_WEB_KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out android-web/app/build/outputs/apk/release/mtunz-web-release.apk \
            "$RUNNER_TEMP/mtunz-web-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs \
            android-web/app/build/outputs/apk/release/mtunz-web-release.apk
          python android-web/tools/verify_release_artifact.py \
            --apk android-web/app/build/outputs/apk/release/mtunz-web-release.apk
      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mtunz-web-android-RELEASE-new-fixed-key
          path: android-web/app/build/outputs/apk/release/mtunz-web-release.apk
          if-no-files-found: error
          retention-days: 30

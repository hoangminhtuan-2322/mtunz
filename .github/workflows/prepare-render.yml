name: Prepare mtunz source for Render

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-render.yml
      - mtunz-source.tar.xz
      - unpack_source.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract verified application source
        run: |
          if [ ! -f mtunz-source.tar.xz ]; then
            echo "Source is already expanded; no changes needed."
            exit 0
          fi
          python unpack_source.py
          test -f app.py
          test -f features.py
          test -f pg_storage.py
          test -f static/index.html
          test -f static/app.js
          test -f tests/test_render_adapter.py

      - name: Install dependencies and run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Publish files directly in main for Render
        run: |
          if [ ! -f mtunz-source.tar.xz ]; then
            echo "Nothing to publish."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          blueprint = Path('render.yaml')
          text = blueprint.read_text(encoding='utf-8')
          commands = [
              'buildCommand: python unpack_source.py && pip install -r requirements.txt',
              'buildCommand: pip install -r requirements.txt',
          ]
          if not any(cmd in text for cmd in commands):
              raise SystemExit("Unexpected Render build command; refusing to change configuration")
          text = text.replace(commands[0], commands[1])
          blueprint.write_text(text, encoding='utf-8')
          Path('mtunz-source.tar.xz').unlink()
          Path('unpack_source.py').unlink()
          PY
          git config user.name "mtunz-deploy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Expand mtunz source and deploy directly on Render"
            git push origin HEAD:main
          fi

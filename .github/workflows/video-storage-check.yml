name: Private video storage unit tests
on:
  pull_request:
    paths:
      - 'video_storage.py'
      - 'requirements-video.txt'
      - 'tests/test_video_storage.py'
      - '.github/workflows/video-storage-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-video.txt
      - run: python -m unittest discover -s tests -p test_video_storage.py

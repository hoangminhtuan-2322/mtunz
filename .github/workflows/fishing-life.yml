name: Fishing Life checks
on:
  pull_request:
    paths:
      - 'fishing_life.py'
      - 'tests/test_fishing_life.py'
      - 'static/fishing-life.*'
      - 'mobile/src/FishingLife.js'
      - '.github/workflows/fishing-life.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fishing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_fishing_life.py
      - run: node --check static/fishing-life.js
      - run: node --check static/app.js
